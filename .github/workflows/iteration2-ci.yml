name: Iteration 4 CI

on:
  push:
    branches:
      - devin/1788666549-fpv-mvp
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Chromium for focused E2E
        run: npx playwright install --with-deps chromium
      - name: Run high-value Chromium E2E only
        run: npx playwright test --project=chromium
